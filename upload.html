<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Panel</title>
  <style>
    :root { --bg:#0e1116; --surface:#161b22; --border:#2a3340; --text:#e6edf3; --muted:#93a1b1; --accent:#4f8cff; --ok:#3fb950; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
    .header { padding:1rem; background:var(--surface); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; }
    .header a { color:var(--accent); text-decoration:none; font-weight:bold; }
    .container { max-width:600px; margin:2rem auto; padding:0 1rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.5rem; margin-bottom:1rem; }
    .field { margin-bottom:1rem; }
    label { display:block; margin-bottom:0.4rem; font-size:0.9rem; font-weight:600; }
    input { width:100%; padding:0.8rem; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); }
    .dropzone { border:2px dashed var(--border); border-radius:12px; padding:2rem; text-align:center; cursor:pointer; }
    .file-list { list-style:none; padding:0; margin-top:1rem; }
    .file-row { display:flex; gap:1rem; align-items:center; background:var(--bg); padding:0.5rem; border-radius:8px; margin-bottom:0.5rem; }
    .file-row img { width:40px; height:40px; object-fit:cover; border-radius:4px; }
    .btn { width:100%; padding:1rem; border:none; border-radius:8px; background:var(--accent); color:white; font-weight:bold; cursor:pointer; }
    .btn:disabled { opacity:0.5; }
    .log { background:#000; color:#0f0; padding:1rem; border-radius:8px; font-family:monospace; font-size:0.8rem; max-height:200px; overflow:auto; display:none; margin-top:1rem; }
  </style>
</head>
<body>
  <div class="header">
    <div>⬆ Upload Panel</div>
    <a href="index.html">← Library</a>
  </div>
  <div class="container">
    <div class="card">
      <div class="field">
        <label>GitHub Token (PAT)</label>
        <input id="token" type="password" placeholder="github_pat_...">
      </div>
      <div class="field">
        <label>Book Name</label>
        <input id="title" placeholder="जैसे: Biology Chapter 2">
      </div>
      <div class="field">
        <label>Folder Name (Slug)</label>
        <input id="slug" placeholder="biology-chapter-2">
      </div>
    </div>

    <div class="card">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <p><b>Click to choose images</b> or drag & drop</p>
      </div>
      <ul class="file-list" id="fileList"></ul>
      <button class="btn" id="uploadBtn" disabled>Upload to GitHub</button>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const REPO = 'Studycare1/BiologyGuess';
    const BRANCH = 'main';
    const $ = id => document.getElementById(id);
    let files = [], isUploading = false;

    $('title').oninput = (e) => {
      $('slug').value = e.target.value.toLowerCase().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '');
      checkReady();
    };
    $('token').oninput = checkReady;
    $('slug').oninput = checkReady;

    function checkReady() {
      $('uploadBtn').disabled = !($('token').value.trim() && $('slug').value.trim() && files.length) || isUploading;
    }

    $('dropzone').onclick = () => $('fileInput').click();
    $('fileInput').onchange = (e) => addFiles(e.target.files);
    $('dropzone').ondragover = (e) => { e.preventDefault(); $('dropzone').style.borderColor = '#4f8cff'; };
    $('dropzone').ondragleave = () => $('dropzone').style.borderColor = '';
    $('dropzone').ondrop = (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); };

    function addFiles(list) {
      for (let f of list) {
        if (f.type.startsWith('image/')) files.push({ file: f, url: URL.createObjectURL(f) });
      }
      render();
    }

    function render() {
      $('fileList').innerHTML = files.map((f, i) => `
        <li class="file-row">
          <img src="${f.url}">
          <span style="flex:1;font-size:0.8rem">${i+1}. ${f.file.name}</span>
          <button onclick="files.splice(${i},1);render()" style="background:red;color:white;border:none;border-radius:4px;padding:2px 6px;cursor:pointer">✕</button>
        </li>
      `).join('');
      checkReady();
    }

    function toBase64(f) {
      return new Promise(res => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]);
        r.readAsDataURL(f);
      });
    }

    $('uploadBtn').onclick = async () => {
      const token = $('token').value.trim();
      const slug = $('slug').value.trim();
      const title = $('title').value.trim();
      if (!token || !slug || !files.length) return;

      isUploading = true; checkReady();
      $('log').style.display = 'block'; $('log').textContent = '';
      const log = m => { $('log').textContent += m + '\n'; $('log').scrollTop = 9999; };

      const ext = files[0].file.name.split('.').pop().toLowerCase();
      let success = 0;

      for (let i = 0; i < files.length; i++) {
        const fname = `page-${String(i+1).padStart(3,'0')}.${ext}`;
        const path = `books/${slug}/${fname}`;
        log(`⏳ Uploading ${fname}...`);
        try {
          const b64 = await toBase64(files[i].file);
          let sha = null;
          const g = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { headers: { Authorization: `Bearer ${token}` } });
          if (g.ok) sha = (await g.json()).sha;

          const body = { message: `upload ${fname}`, content: b64, branch: BRANCH };
          if (sha) body.sha = sha;

          const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
            method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error('Failed');
          log(`✅ ${fname} uploaded`);
          success++;
        } catch (err) { log(`❌ ${fname} failed`); }
      }

      if (success > 0) {
        log(`⏳ Updating index.json...`);
        try {
          const idxPath = 'books/index.json';
          const g = await fetch(`https://api.github.com/repos/${REPO}/contents/${idxPath}`, { headers: { Authorization: `Bearer ${token}` } });
          let idx = { books: [] }, sha = null;
          if (g.ok) {
            const d = await g.json();
            sha = d.sha;
            idx = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g, '')))));
          }
          idx.books = idx.books.filter(b => b.slug !== slug);
          idx.books.unshift({ slug, title, pages: success, ext, cover: `books/${slug}/page-001.${ext}` });

          const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(idx, null, 2))));
          const body = { message: `update index`, content: b64, branch: BRANCH };
          if (sha) body.sha = sha;
          await fetch(`https://api.github.com/repos/${REPO}/contents/${idxPath}`, {
            method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
          });
          log(`🎉 SUCCESS! Book added to library.`);
        } catch (err) { log(`❌ Index update failed`); }
      }
      isUploading = false; checkReady();
    };
  </script>
</body>
</html>
