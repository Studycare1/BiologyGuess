<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Book Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">📖</span>
      <span class="brand-text">Digital Book Reader</span>
    </div>
    <div class="header-actions">
      <a class="btn ghost" href="upload.html">＋ Upload</a>
      <button id="themeBtn" class="btn ghost">🌙</button>
    </div>
  </header>

  <main class="container">
    <div id="libraryStatus" class="status">लोड हो रहा है...</div>
    <section id="library" class="library"></section>
    <div id="emptyState" class="empty" style="display:none;">
      <h2>कोई किताब नहीं मिली</h2>
      <p>कृपया <a href="upload.html">Upload Panel</a> से किताब जोड़ें।</p>
    </div>
  </main>

  <div id="reader" class="reader" style="display:none;">
    <div class="reader-bar">
      <button id="closeReader" class="btn ghost">✕</button>
      <div class="reader-title"><strong id="readerTitle">—</strong></div>
      <div class="reader-tools">
        <button id="zoomBtn" class="btn ghost">⤢</button>
      </div>
    </div>
    <div id="pageStage" class="page-stage">
      <img id="pageImage" class="page-image" alt="">
      <button id="prevBtn" class="nav-btn prev">‹</button>
      <button id="nextBtn" class="nav-btn next">›</button>
    </div>
    <div class="reader-footer">
      <span id="pageCounter" class="counter">1 / 1</span>
      <input id="pageSlider" class="slider" type="range" min="1" max="1" value="1">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
