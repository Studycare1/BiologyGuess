  { ch: "4", diff: "Moderate", q: "Which chromosome is affected in Down's syndrome?", a: "Trisomy of chromosome 21" },
  { ch: "4", diff: "Moderate", q: "What is the total chromosome number in Down's syndrome?", a: "47" },
  { ch: "4", diff: "Moderate", q: "What is mutation?", a: "Sudden change in the DNA sequence" },
  { ch: "4", diff: "Moderate", q: "What is a point mutation?", a: "Change in a single base pair of DNA" },
  { ch: "4", diff: "Moderate", q: "What is the genotypic ratio in codominance?", a: "1:2:1" },
  { ch: "4", diff: "Hard", q: "What is linkage?", a: "Tendency of genes on the same chromosome to be inherited together" },
  { ch: "4", diff: "Hard", q: "Who proposed the chromosomal theory of inheritance?", a: "Sutton and Boveri" },
  { ch: "4", diff: "Hard", q: "What is crossing over?", a: "Exchange of segments between non-sister chromatids of homologous chromosomes" },
  { ch: "4", diff: "Hard", q: "What is the Hardy–Weinberg equation?", a: "p² + 2pq + q² = 1" },
  { ch: "4", diff: "Hard", q: "What is Klinefelter's syndrome?", a: "47, XXY – male with an extra X chromosome" },
  { ch: "4", diff: "Hard", q: "What is Turner's syndrome?", a: "45, XO – female with a missing X chromosome" },
  { ch: "4", diff: "Hard", q: "What is color blindness?", a: "X-linked recessive disorder; inability to distinguish red and green" },
  { ch: "4", diff: "Hard", q: "What is hemophilia?", a: "X-linked recessive disorder; defective blood clotting" },
  { ch: "4", diff: "Hard", q: "Who is called the 'Father of Human Genetics'?", a: "Archibald Garrod" },
  { ch: "4", diff: "Hard", q: "What is the 'Evil Quartet' in the context of variation?", a: "Mutations, recombination, natural selection, genetic drift" },
  { ch: "4", diff: "Hard", q: "What is aneuploidy?", a: "Abnormal number of chromosomes due to non-disjunction" },
  { ch: "4", diff: "Hard", q: "What is polyploidy?", a: "Presence of more than two sets of chromosomes" },
  { ch: "4", diff: "Hard", q: "What is the effect of the GAG to GUG mutation?", a: "Glutamic acid is replaced by valine (sickle cell anemia)" },
  { ch: "4", diff: "Hard", q: "What is a frameshift mutation?", a: "Insertion or deletion that shifts the reading frame" },
  { ch: "4", diff: "Hard", q: "What is a 'carrier' in genetics?", a: "A heterozygous individual showing no symptoms but transmitting the recessive allele" },
  { ch: "4", diff: "Hard", q: "Why are X-linked recessive disorders more common in males?", a: "Males have only one X chromosome (hemizygous)" },

  // CHAPTER 5: Molecular Basis of Inheritance
  { ch: "5", diff: "Simple", q: "What does DNA stand for?", a: "Deoxyribonucleic Acid" },
  { ch: "5", diff: "Simple", q: "What does RNA stand for?", a: "Ribonucleic Acid" },
  { ch: "5", diff: "Simple", q: "What is the shape of the DNA molecule?", a: "Double helix" },
  { ch: "5", diff: "Simple", q: "What sugar is present in DNA?", a: "Deoxyribose" },
  { ch: "5", diff: "Simple", q: "What sugar is present in RNA?", a: "Ribose" },
  { ch: "5", diff: "Simple", q: "Which nitrogenous base is in RNA but not in DNA?", a: "Uracil" },
  { ch: "5", diff: "Simple", q: "Which nitrogenous base is in DNA but not in RNA?", a: "Thymine" },
  { ch: "5", diff: "Simple", q: "Which nitrogenous bases are purines?", a: "Adenine and Guanine" },
  { ch: "5", diff: "Simple", q: "Which nitrogenous bases are pyrimidines?", a: "Cytosine, Thymine, Uracil" },
  { ch: "5", diff: "Simple", q: "Who proposed the double-helix model of DNA?", a: "Watson and Crick (1953)" },
  { ch: "5", diff: "Simple", q: "What is a nucleotide?", a: "A sugar + phosphate + nitrogenous base" },
  { ch: "5", diff: "Simple", q: "What is a codon?", a: "A triplet of bases coding for one amino acid" },
  { ch: "5", diff: "Simple", q: "What is the start codon?", a: "AUG (codes for methionine)" },
  { ch: "5", diff: "Simple", q: "What are the stop codons?", a: "UAA, UAG, UGA" },
  { ch: "5", diff: "Simple", q: "What is the central dogma?", a: "DNA → RNA → Protein" },
  { ch: "5", diff: "Simple", q: "What is the function of DNA helicase?", a: "Unwinds the DNA double helix" },
  { ch: "5", diff: "Simple", q: "What is the function of DNA ligase?", a: "Joins DNA fragments" },
  { ch: "5", diff: "Simple", q: "What is the function of RNA polymerase?", a: "Synthesizes RNA from DNA" },
  { ch: "5", diff: "Simple", q: "What is the function of DNA polymerase?", a: "Synthesizes new DNA strands" },
  { ch: "5", diff: "Simple", q: "How many codons code for amino acids in the genetic code?", a: "64 (61 sense + 3 stop)" },
  { ch: "5", diff: "Moderate", q: "What is transcription?", a: "Synthesis of RNA from a DNA template" },
  { ch: "5", diff: "Moderate", q: "What is translation?", a: "Synthesis of protein from mRNA" },
  { ch: "5", diff: "Moderate", q: "What is semi-conservative DNA replication?", a: "Each new DNA molecule has one old and one new strand" },
  { ch: "5", diff: "Moderate", q: "How many hydrogen bonds form between A and T?", a: "2" },
  { ch: "5", diff: "Moderate", q: "How many hydrogen bonds form between G and C?", a: "3" },
  { ch: "5", diff: "Moderate", q: "What is Chargaff's rule?", a: "A = T and G = C" },
  { ch: "5", diff: "Moderate", q: "What is a nucleosome?", a: "DNA wrapped around a histone octamer" },
  { ch: "5", diff: "Moderate", q: "What is the length of one complete turn of the DNA helix?", a: "3.4 nm (10 base pairs)" },
  { ch: "5", diff: "Moderate", q: "What are Okazaki fragments?", a: "Short DNA fragments on the lagging strand" },
  { ch: "5", diff: "Moderate", q: "What is the role of the promoter?", a: "Site where RNA polymerase binds to start transcription" },
  { ch: "5", diff: "Moderate", q: "What is capping in mRNA processing?", a: "Adding methyl guanosine triphosphate to the 5' end" },
  { ch: "5", diff: "Moderate", q: "What is tailing in mRNA processing?", a: "Adding poly-A tail to the 3' end" },
  { ch: "5", diff: "Moderate", q: "What is splicing?", a: "Removal of introns and joining of exons" },
  { ch: "5", diff: "Moderate", q: "What is the role of tRNA?", a: "Carries amino acids to the ribosome during translation" },
  { ch: "5", diff: "Moderate", q: "What is the anticodon?", a: "Three bases on tRNA complementary to the mRNA codon" },
  { ch: "5", diff: "Moderate", q: "What is the lac operon?", a: "Inducible operon for lactose metabolism" },
  { ch: "5", diff: "Moderate", q: "What is the inducer of the lac operon?", a: "Lactose" },
  { ch: "5", diff: "Moderate", q: "What is a palindrome in DNA?", a: "Sequence reading the same on both strands (5'→3')" },
  { ch: "5", diff: "Moderate", q: "What is the Human Genome Project (HGP)?", a: "Project to sequence the entire human genome (1990–2003)" },
  { ch: "5", diff: "Moderate", q: "How many genes are estimated in the human genome?", a: "About 30,000" },
  { ch: "5", diff: "Moderate", q: "What is DNA fingerprinting?", a: "Identification technique based on unique DNA repeat patterns" },
  { ch: "5", diff: "Moderate", q: "What does VNTR stand for?", a: "Variable Number of Tandem Repeats" },
  { ch: "5", diff: "Moderate", q: "Who developed DNA fingerprinting?", a: "Alec Jeffreys (1984)" },
  { ch: "5", diff: "Moderate", q: "What is the polymerase chain reaction?", a: "In vitro amplification of DNA" },
  { ch: "5", diff: "Hard", q: "What is the length of the human DNA (per cell)?", a: "About 2.2 metres" },
  { ch: "5", diff: "Hard", q: "What is the size of the human genome in base pairs?", a: "About 3.1 billion" },
  { ch: "5", diff: "Hard", q: "What is the 'C-value paradox'?", a: "Genome size does not correlate with organism complexity" },
  { ch: "5", diff: "Hard", q: "What is the function of the TATA box?", a: "Binding site for transcription factors upstream of the promoter" },
  { ch: "5", diff: "Hard", q: "Who proposed the 'One Gene–One Enzyme' hypothesis?", a: "Beadle and Tatum" },
  { ch: "5", diff: "Hard", q: "What are the three steps of PCR?", a: "Denaturation, Annealing, Extension" },
  { ch: "5", diff: "Hard", q: "What is the temperature for PCR denaturation?", a: "About 94°C" },
  { ch: "5", diff: "Hard", q: "Which enzyme is used in PCR?", a: "Taq polymerase (from Thermus aquaticus)" },
  { ch: "5", diff: "Hard", q: "What is 'satellite DNA'?", a: "Repetitive non-coding DNA used in fingerprinting" },
  { ch: "5", diff: "Hard", q: "What is the Meselson–Stahl experiment about?", a: "Evidence for semi-conservative DNA replication" },
  { ch: "5", diff: "Hard", q: "What is a 'transforming principle'?", a: "DNA from one bacterium can transform another (Griffith)" },
  { ch: "5", diff: "Hard", q: "What did Avery, MacLeod and McCarty prove?", a: "DNA is the transforming principle" },
  { ch: "5", diff: "Hard", q: "What is the role of the ribosome in translation?", a: "Site of protein synthesis" },
  { ch: "5", diff: "Hard", q: "What are the components of a eukaryotic ribosome?", a: "60S and 40S subunits (80S)" },
  { ch: "5", diff: "Hard", q: "What are the components of a prokaryotic ribosome?", a: "50S and 30S subunits (70S)" },
  { ch: "5", diff: "Hard", q: "What is a mutation hotspot?", a: "A DNA region with a high mutation rate" },
  { ch: "5", diff: "Hard", q: "What is a polycistronic mRNA?", a: "mRNA coding for multiple proteins (in prokaryotes)" },
  { ch: "5", diff: "Hard", q: "What is a monocistronic mRNA?", a: "mRNA coding for a single protein (in eukaryotes)" },
  { ch: "5", diff: "Hard", q: "What is a ribozyme?", a: "RNA molecule with catalytic activity" },
  { ch: "5", diff: "Hard", q: "What is a codon bias?", a: "Non-random use of synonymous codons" },
  { ch: "5", diff: "Hard", q: "What is 'junk DNA'?", a: "Non-coding DNA with regulatory or unknown function" },
  { ch: "5", diff: "Hard", q: "What is the function of telomeres?", a: "Protect chromosome ends from degradation" },
  { ch: "5", diff: "Hard", q: "What is the function of centromeres?", a: "Attachment site for spindle fibers during cell division" },
  { ch: "5", diff: "Hard", q: "What is the difference between DNA and RNA?", a: "DNA has deoxyribose and thymine; RNA has ribose and uracil" },

  // CHAPTER 6: Evolution
  { ch: "6", diff: "Simple", q: "Who proposed the theory of natural selection?", a: "Charles Darwin" },
  { ch: "6", diff: "Simple", q: "What is the famous book written by Darwin?", a: "On the Origin of Species (1859)" },
  { ch: "6", diff: "Simple", q: "What is the scientific name of modern humans?", a: "Homo sapiens" },
  { ch: "6", diff: "Simple", q: "What are homologous organs?", a: "Organs with the same origin but different functions" },
  { ch: "6", diff: "Simple", q: "What are analogous organs?", a: "Organs with different origins but similar functions" },
  { ch: "6", diff: "Simple", q: "What is a fossil?", a: "Preserved remains of ancient organisms" },
  { ch: "6", diff: "Simple", q: "What is the study of fossils called?", a: "Paleontology" },
  { ch: "6", diff: "Simple", q: "Which ship did Darwin travel on?", a: "HMS Beagle" },
  { ch: "6", diff: "Simple", q: "What is evolution?", a: "Gradual change in organisms over generations" },
  { ch: "6", diff: "Simple", q: "Are monkeys the direct ancestors of humans?", a: "No, humans and monkeys share a common ancestor" },
  { ch: "6", diff: "Simple", q: "What is a primate?", a: "A group of mammals including monkeys, apes, and humans" },
  { ch: "6", diff: "Simple", q: "Which is the earliest hominid genus?", a: "Australopithecus" },
  { ch: "6", diff: "Simple", q: "What is the scientific name of the extinct species Homo erectus?", a: "Homo erectus" },
  { ch: "6", diff: "Simple", q: "What is mutation in the context of evolution?", a: "Source of new genetic variation" },
  { ch: "6", diff: "Simple", q: "What is genetic drift?", a: "Random change in allele frequencies in small populations" },
  { ch: "6", diff: "Moderate", q: "What is adaptive radiation?", a: "Rapid diversification of a species into many forms" },
  { ch: "6", diff: "Moderate", q: "Give an example of adaptive radiation.", a: "Darwin's finches in the Galapagos Islands" },
  { ch: "6", diff: "Moderate", q: "What is industrial melanism?", a: "Darkening of moths in polluted industrial areas" },
  { ch: "6", diff: "Moderate", q: "Which moth is used as an example of industrial melanism?", a: "Biston betularia (peppered moth)" },
  { ch: "6", diff: "Moderate", q: "What is the Hardy–Weinberg principle?", a: "Allele frequencies remain constant in a large, random-mating population" },
  { ch: "6", diff: "Moderate", q: "What are the factors affecting Hardy–Weinberg equilibrium?", a: "Mutation, recombination, natural selection, genetic drift, gene flow" },
  { ch: "6", diff: "Moderate", q: "What is the founder's effect?", a: "A new population founded by a few individuals with limited gene pool" },
  { ch: "6", diff: "Moderate", q: "What is the bottleneck effect?", a: "Sudden drastic reduction in population size" },
  { ch: "6", diff: "Moderate", q: "What is gene flow?", a: "Movement of alleles between populations through migration" },
  { ch: "6", diff: "Moderate", q: "What is the theory of spontaneous generation?", a: "Belief that life arises from non-living matter" },
  { ch: "6", diff: "Moderate", q: "What is panspermia?", a: "Hypothesis that life came to Earth from space" },
  { ch: "6", diff: "Moderate", q: "What is the 'big bang' in the context of evolution?", a: "Origin of the universe ~13.7 billion years ago" },
  { ch: "6", diff: "Moderate", q: "What is the 'RNA world hypothesis'?", a: "RNA was the first genetic material" },
  { ch: "6", diff: "Moderate", q: "What is the difference between microevolution and macroevolution?", a: "Micro: small changes within a species; Macro: large changes forming new species" },
  { ch: "6", diff: "Moderate", q: "What is Lamarck's theory of evolution?", a: "Inheritance of acquired characters" },
  { ch: "6", diff: "Moderate", q: "What is Archaeopteryx?", a: "A connecting link between reptiles and birds" },
  { ch: "6", diff: "Moderate", q: "What is the 'living fossil'?", a: "An organism that has remained unchanged for millions of years (e.g., Coelacanth)" },
  { ch: "6", diff: "Moderate", q: "What is a connecting link?", a: "An organism showing features of two different groups" },
  { ch: "6", diff: "Hard", q: "How old is the Earth?", a: "About 4.6 billion years" },
  { ch: "6", diff: "Hard", q: "What is the 'Cambrian explosion'?", a: "Sudden appearance of diverse life forms about 540 million years ago" },
  { ch: "6", diff: "Hard", q: "What is the 'molecular clock'?", a: "Uses DNA/protein differences to estimate evolutionary time" },
  { ch: "6", diff: "Hard", q: "What is the age of the oldest known fossils?", a: "About 3.5 billion years" },
  { ch: "6", diff: "Hard", q: "What is the 'Endosymbiotic theory'?", a: "Mitochondria and chloroplasts evolved from engulfed bacteria" },
  { ch: "6", diff: "Hard", q: "Who proposed the endosymbiotic theory?", a: "Lynn Margulis" },
  { ch: "6", diff: "Hard", q: "How much DNA do humans share with chimpanzees?", a: "About 98.8%" },
  { ch: "6", diff: "Hard", q: "What is a phylogenetic tree?", a: "A diagram showing evolutionary relationships" },
  { ch: "6", diff: "Hard", q: "What is convergent evolution?", a: "Different species evolve similar traits independently" },
  { ch: "6", diff: "Hard", q: "What is divergent evolution?", a: "Same ancestor lineage evolves into different forms" },
  { ch: "6", diff: "Hard", q: "What is the 'fitness' of an organism?", a: "Ability to survive and reproduce" },
  { ch: "6", diff: "Hard", q: "What is 'survival of the fittest'?", a: "Organisms best adapted to environment survive and reproduce" },
  { ch: "6", diff: "Hard", q: "What is a species?", a: "A group of organisms that can interbreed to produce fertile offspring" },
  { ch: "6", diff: "Hard", q: "What is reproductive isolation?", a: "Barriers preventing interbreeding between species" },
  { ch: "6", diff: "Hard", q: "What are the two types of speciation?", a: "Allopatric (geographic) and sympatric (no geographic isolation)" },
  { ch: "6", diff: "Hard", q: "Which epoch is known as the 'Age of Mammals'?", a: "Cenozoic era" },

        // JS Logic
        const container = document.getElementById('questionContainer');
        const chapterFilter = document.getElementById('chapterFilter');
        const difficultyFilter = document.getElementById('difficultyFilter');
        const searchInput = document.getElementById('searchInput');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');

        let currentPage = 1;
        const itemsPerPage = 20;
        let filteredData = [...biologyData];

        function updateUI() {
            const selectedChapter = chapterFilter.value;
            const selectedDifficulty = difficultyFilter.value;
            const searchText = searchInput.value.toLowerCase();

            filteredData = biologyData.filter(item => {
                const matchChapter = selectedChapter === 'all' || item.ch === selectedChapter;
                const matchDifficulty = selectedDifficulty === 'all' || item.diff === selectedDifficulty;
                const matchSearch = item.q.toLowerCase().includes(searchText) || item.a.toLowerCase().includes(searchText);
                return matchChapter && matchDifficulty && matchSearch;
            });

            const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedData = filteredData.slice(startIndex, endIndex);

            container.innerHTML = '';
            if (paginatedData.length === 0) {
                container.innerHTML = '<p style="text-align:center;">No questions found</p>';
            } else {
                paginatedData.forEach((item, index) => {
                    const globalIndex = startIndex + index + 1;
                    const div = document.createElement('div');
                    div.className = 'question-item';

                    let diffLabel = item.diff;
                    if (item.diff === 'Simple') diffLabel = 'Simple';
                    if (item.diff === 'Moderate') diffLabel = 'Moderate';
                    if (item.diff === 'Hard') diffLabel = 'Hard';

                    div.innerHTML = `
                        <div style="margin-bottom: 5px;">
                            <span class="badge ${item.diff}">${diffLabel}</span>
                            <span class="q-text">Q${globalIndex}: ${item.q}</span>
                        </div>
                        <div>
                            <span class="a-text">Answer: ${item.a}</span>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            pageInfo.textContent = `Page ${currentPage} / ${totalPages} (Total: ${filteredData.length} questions)`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            updateUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        chapterFilter.addEventListener('change', () => { currentPage = 1; updateUI(); });
        difficultyFilter.addEventListener('change', () => { currentPage = 1; updateUI(); });
        searchInput.addEventListener('input', () => { currentPage = 1; updateUI(); });

        updateUI();
    </script>
